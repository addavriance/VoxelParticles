pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'voxelparticles'

// Every target is versions/<minecraft>/<loader>; its settings live in versions/<minecraft>/version.properties.
def requested = (settings.providers.gradleProperty('targets').getOrElse('') ?: '')
	.split(',').collect { it.trim() }.findAll { it }

file('versions').eachDir { mcDir ->
	def versionProps = new Properties()
	new File(mcDir, 'version.properties').withInputStream { versionProps.load(it) }

	mcDir.eachDir { loaderDir ->
		if (loaderDir.name == 'common' || !new File(loaderDir, 'build.gradle').exists()) {
			return
		}
		// "<loader>_build=isolated" targets need a Gradle plugin that cannot share a classpath with this build's; see forge-loom
		if (versionProps.getProperty("${loaderDir.name}_build") == 'isolated') {
			return
		}
		String name = "${mcDir.name}-${loaderDir.name}"
		if (requested.isEmpty() || requested.contains(name)) {
			include(name)
			project(":${name}").projectDir = loaderDir
		}
	}
}

includeBuild('forge-loom')
