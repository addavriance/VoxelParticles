plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.18.4' apply false
	id 'net.fabricmc.fabric-loom' version '1.18.4' apply false
	id 'net.neoforged.moddev' version '2.0.148' apply false
	id 'net.neoforged.moddev.legacyforge' version '2.0.148' apply false
}

apply from: 'gradle/publish.gradle'

// Collects every target's release jar into dist/.
tasks.register('dist') {
	group = 'build'
	description = 'Builds all targets and copies the release jars into dist/'
	dependsOn subprojects.collect { "${it.path}:collectJar" }
	dependsOn gradle.includedBuild('forge-loom').task(':dist')
}
